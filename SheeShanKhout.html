<!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/SheeShanKhout.css">
</head>
<body>
    <p class="title">Shee Shan Khout</p>

    <button class="move-button js-hlan-button"><img src="images/Hlan.png" class="move-icon"></button>

    <button class="move-button js-dar-button"><img src="images/Dar.png" class="move-icon"></button>

    <button class="move-button js-kat-kyee-button"><img src="images/Kat Kyee.png" class="move-icon"></button>

    <p class="move-keydown">Press "1" to pick Hlan, "2" to pick Dar and "3" to pick Kat Kyee</p>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>

    <button class="reset-score-button js-reset-score-button">Reset Score</button>

    <button class="auto-play-button js-auto-play-button">Auto Play</button>

    <div class="auto-play-status-js auto-play-status"></div>

    <p class="js-reset-score-confirmation"></p>

    <script src="scripts/SheeShanKhout.js"></script>
    </body>
</html>
